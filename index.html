<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

    html, body {

    .phone {
      color: #2154b4;
      font-size: 1.25rem;
      margin-top: 1rem;
    }

    .phone a {
      color: #2154b4;
      text-decoration: none;
    }

    .links {
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;   /* tight gap — change to 0.4rem for more breathing room */

    .links a {
      color: #1e90ff;
