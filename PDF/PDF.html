<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&display=swap" />
  <style>
    a { color: #5980a6; }
    a:hover { color: #416180; }
  </style>
</helmet>
<div style="min-height:100vh; background:#f2f2f3; font-family:'Barlow',system-ui,sans-serif; color:#1d1f20; display:flex; justify-content:center; padding:56px 24px;">
  <div style="max-width:900px; width:100%;">
    <h1 style="font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:600; font-size:42px; letter-spacing:-0.015em; margin:0 0 24px 0; text-align:center;">PDF-IMAGE-MANAGER</h1>

    <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; margin-bottom:14px; align-items:stretch;">
      <div
        onDragOver="{{ onDragOver }}"
        onDragLeave="{{ onDragLeave }}"
        onDrop="{{ onDrop }}"
        onClick="{{ onDropzoneClick }}"
        style="position:relative; border:1px solid {{ dropBorderColor }}; padding:20px; text-align:center; cursor:pointer; background:{{ dropBg }}; display:flex; flex-direction:column; align-items:center; justify-content:center;"
      >
        <div style="position:absolute; top:-6px; left:-6px; width:11px; height:11px; color:rgba(29,31,32,0.55);" style-before="content:''; position:absolute; left:5px; top:0; width:1px; height:100%; background:currentColor;" style-after="content:''; position:absolute; top:5px; left:0; width:100%; height:1px; background:currentColor;"></div>
        <div style="position:absolute; top:-6px; right:-6px; width:11px; height:11px; color:rgba(29,31,32,0.55);" style-before="content:''; position:absolute; left:5px; top:0; width:1px; height:100%; background:currentColor;" style-after="content:''; position:absolute; top:5px; left:0; width:100%; height:1px; background:currentColor;"></div>
        <div style="position:absolute; bottom:-6px; left:-6px; width:11px; height:11px; color:rgba(29,31,32,0.55);" style-before="content:''; position:absolute; left:5px; top:0; width:1px; height:100%; background:currentColor;" style-after="content:''; position:absolute; top:5px; left:0; width:100%; height:1px; background:currentColor;"></div>
        <div style="position:absolute; bottom:-6px; right:-6px; width:11px; height:11px; color:rgba(29,31,32,0.55);" style-before="content:''; position:absolute; left:5px; top:0; width:1px; height:100%; background:currentColor;" style-after="content:''; position:absolute; top:5px; left:0; width:100%; height:1px; background:currentColor;"></div>
        <div style="font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:600; font-size:18px; margin-bottom:4px;">{{ dropHeadline }}</div>
        <div style="font-size:13px; color:rgba(29,31,32,0.55);">Drop PDF or image files here, or click to browse. Only PDFs and images are accepted.</div>
        <input ref="{{ fileInputRef }}" type="file" multiple="{{ true }}" onChange="{{ onFileInput }}" style="display:none" />
      </div>

      <div style="grid-column:span 2; border:1px solid rgba(29,31,32,0.16); padding:16px; display:flex; flex-direction:column; gap:8px;">
        <div style="font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:rgba(29,31,32,0.6); margin-bottom:4px;">Dropped files</div>
        <sc-if value="{{ noFiles }}" hint-placeholder-val="{{ true }}">
          <div style="text-align:center; color:rgba(29,31,32,0.45); padding:20px; font-size:13px;">No files yet — drop a PDF or image on the left.</div>
        </sc-if>
        <sc-for list="{{ files }}" as="file" hint-placeholder-count="0">
          <div style="display:flex; align-items:center; gap:10px; border:1px solid rgba(29,31,32,0.12); padding:8px 10px;">
            <div style="flex:1; min-width:0; font-weight:{{ file.fontWeight }}; font-size:{{ file.fontSize }}px; color:{{ file.textColor }}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:font-size 0.2s ease, color 0.2s ease;">{{ file.name }}</div>
            <span style="font-size:10px; padding:2px 8px; background:{{ file.tagBg }}; color:{{ file.tagColor }}; flex-shrink:0;">{{ file.categoryLabel }}</span>
            <button onClick="{{ file.toggleUse }}" style="border:1px solid {{ file.useBorder }}; background:{{ file.useBg }}; color:{{ file.useColor }}; font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:600; font-size:12px; padding:6px 12px; cursor:pointer; flex-shrink:0;">USE</button>
            <button onClick="{{ file.remove }}" style="border:1px solid rgba(29,31,32,0.16); background:transparent; color:rgba(29,31,32,0.6); font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:600; font-size:12px; padding:6px 12px; cursor:pointer; flex-shrink:0;" style-hover="background:rgba(139,44,44,0.08); color:#8a2c2c; border-color:#8a2c2c;">DELETE</button>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:14px;">
      <sc-for list="{{ tiles }}" as="tile" hint-placeholder-count="9">
        <a
          href="{{ tile.href }}"
          style="position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; aspect-ratio:1; border:1px solid {{ tile.borderColor }}; background:#fff; text-decoration:none; color:#1d1f20; padding:10px; pointer-events:{{ tile.pointerEvents }}; opacity:{{ tile.opacity }}; filter:{{ tile.filterCss }}; transition:opacity 0.3s ease, filter 0.3s ease;"
        >
          <div style="position:absolute; top:-6px; left:-6px; width:11px; height:11px; color:rgba(29,31,32,0.55);" style-before="content:''; position:absolute; left:5px; top:0; width:1px; height:100%; background:currentColor;" style-after="content:''; position:absolute; top:5px; left:0; width:100%; height:1px; background:currentColor;"></div>
          <div style="position:absolute; top:-6px; right:-6px; width:11px; height:11px; color:rgba(29,31,32,0.55);" style-before="content:''; position:absolute; left:5px; top:0; width:1px; height:100%; background:currentColor;" style-after="content:''; position:absolute; top:5px; left:0; width:100%; height:1px; background:currentColor;"></div>
          <div style="position:absolute; bottom:-6px; left:-6px; width:11px; height:11px; color:rgba(29,31,32,0.55);" style-before="content:''; position:absolute; left:5px; top:0; width:1px; height:100%; background:currentColor;" style-after="content:''; position:absolute; top:5px; left:0; width:100%; height:1px; background:currentColor;"></div>
          <div style="position:absolute; bottom:-6px; right:-6px; width:11px; height:11px; color:rgba(29,31,32,0.55);" style-before="content:''; position:absolute; left:5px; top:0; width:1px; height:100%; background:currentColor;" style-after="content:''; position:absolute; top:5px; left:0; width:100%; height:1px; background:currentColor;"></div>
          <sc-if value="{{ tile.logo }}" hint-placeholder-val="{{ false }}">
            <img src="{{ tile.logo }}" style="width:{{ tile.logoSize }}px; height:{{ tile.logoSize }}px; object-fit:contain; display:block; transition:width 0.3s ease, height 0.3s ease;" />
          </sc-if>
          <sc-if value="{{ tile.noLogo }}" hint-placeholder-val="{{ true }}">
            <div style="width:{{ tile.initialsSize }}px; height:{{ tile.initialsSize }}px; border:1px solid {{ tile.borderColor }}; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:600; font-size:{{ tile.initialsFontSize }}px; color:{{ tile.iconColor }}; transition:width 0.3s ease, height 0.3s ease;">{{ tile.initials }}</div>
          </sc-if>
          <div style="font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:600; font-size:{{ tile.labelSize }}px; text-align:center; transition:font-size 0.3s ease;">{{ tile.label }}</div>
          <div style="font-size:{{ tile.subtitleSize }}px; color:rgba(29,31,32,0.5); text-align:center; transition:font-size 0.3s ease;">{{ tile.subtitle }}</div>
        </a>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
let idCounter = 1;

class Component extends DCLogic {
  state = { files: [], dragOver: false };
  fileInputRef = React.createRef();

  componentDidMount() {
    this._blockNav = (e) => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; };
    window.addEventListener('dragover', this._blockNav);
    window.addEventListener('drop', this._blockNav);
  }

  componentWillUnmount() {
    window.removeEventListener('dragover', this._blockNav);
    window.removeEventListener('drop', this._blockNav);
  }

  onDropzoneClick = () => this.fileInputRef.current && this.fileInputRef.current.click();
  onDragOver = (e) => { e.preventDefault(); this.setState({ dragOver: true }); };
  onDragLeave = (e) => { e.preventDefault(); this.setState({ dragOver: false }); };

  classifyFile(file) {
    if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) return 'pdf';
    if (file.type.startsWith('image/')) return 'image';
    return null;
  }

  handleFiles(fileList) {
    const accepted = [];
    const rejected = [];
    Array.from(fileList).forEach((file) => {
      const category = this.classifyFile(file);
      if (category) accepted.push({ id: idCounter++, name: file.name, category, used: true });
      else rejected.push(file.name);
    });
    if (accepted.length) this.setState((s) => ({ files: [...s.files, ...accepted] }));
    if (rejected.length) alert('Only PDF and image files are accepted. Skipped: ' + rejected.join(', '));
  }

  onDrop = (e) => {
    e.preventDefault();
    this.setState({ dragOver: false });
    if (e.dataTransfer.files && e.dataTransfer.files.length) this.handleFiles(e.dataTransfer.files);
  };

  onFileInput = (e) => {
    if (e.target.files && e.target.files.length) this.handleFiles(e.target.files);
    e.target.value = '';
  };

  toggleUse(id) {
    this.setState((s) => ({ files: s.files.map((f) => (f.id === id ? { ...f, used: !f.used } : f)) }));
  }

  removeFile(id) {
    const file = this.state.files.find((f) => f.id === id);
    if (!file) return;
    if (confirm(`Remove "${file.name}" from the list?`)) {
      this.setState((s) => ({ files: s.files.filter((f) => f.id !== id) }));
    }
  }

  buildTilePlaceholders(active, category) {
    const tiles = active.map((t) => ({ ...t, category }));
    for (let i = active.length; i < 9; i++) {
      tiles.push({ label: 'Coming soon', initials: '—', subtitle: '', href: '#', category: 'placeholder' });
    }
    return tiles;
  }

  renderVals() {
    const { files, dragOver } = this.state;
    const usedCategories = new Set(files.filter((f) => f.used).map((f) => f.category));
    let detected = null;
    if (usedCategories.size === 1) detected = [...usedCategories][0];

    const pdfActive = [
      { label: 'PDF-JPG', initials: 'JPG', subtitle: 'Export pages as images', href: './PDF to JPG converter.dc.html' },
      { label: 'PDF-CREATOR', initials: 'PDF', subtitle: 'Build a PDF from files', href: './PDF-CREATOR.dc.html', logo: './assets/PDF-CREATOR.jpg' },
      { label: 'PDF-FLATTENER', initials: 'FLT', subtitle: 'Flatten forms & markup', href: './PDF-FLATTENER.dc.html', logo: './assets/PDF-FLATTENER.jpg' },
      { label: 'PDF-MARKUP', initials: 'MRK', subtitle: 'Draw & annotate pages', href: './PDF-MARKUP.dc.html' },
    ];
    const imageActive = [
      { label: 'IMAGE-CONVERTOR', initials: 'IMG', subtitle: 'Convert & save images', href: './IMAGE-CONVERTOR.dc.html' },
      { label: 'IMAGE-SPLITTER', initials: 'SPL', subtitle: 'Split into grid or strips', href: './IMAGE-SPLITTER.dc.html', logo: './assets/IMAGE-SPLITTER.jpg' },
    ];

    const pdfTiles = this.buildTilePlaceholders(pdfActive, 'pdf');
    const imageTiles = this.buildTilePlaceholders(imageActive, 'image');
    const placeholders = pdfTiles.slice(pdfActive.length).concat(imageTiles.slice(imageActive.length));
    const realPdf = pdfTiles.slice(0, pdfActive.length);
    const realImage = imageTiles.slice(0, imageActive.length);

    const ordered = detected === 'image'
      ? [...realImage, ...realPdf, ...placeholders.slice(0, 9 - realImage.length - realPdf.length)]
      : [...realPdf, ...realImage, ...placeholders.slice(0, 9 - realPdf.length - realImage.length)];

    const tiles = ordered.map((t) => {
      const isPlaceholder = t.category === 'placeholder';
      const isMatch = detected && t.category === detected;
      const isOpposing = detected && !isPlaceholder && t.category !== detected;

      let logoSize = 84, initialsSize = 57, initialsFontSize = 20, labelSize = 21, subtitleSize = 14;
      let opacity = isPlaceholder ? 0.5 : 1;
      let filterCss = 'none';
      let borderColor = isPlaceholder ? 'rgba(29,31,32,0.16)' : '#5980a6';
      let iconColor = isPlaceholder ? 'rgba(29,31,32,0.35)' : '#5980a6';

      if (isMatch) {
        logoSize = 130; initialsSize = 88; initialsFontSize = 30; labelSize = 27; subtitleSize = 15;
      } else if (isOpposing) {
        logoSize = 44; initialsSize = 34; initialsFontSize = 13; labelSize = 13; subtitleSize = 10;
        opacity = 0.35;
        filterCss = 'blur(2px)';
      }

      return {
        ...t,
        borderColor, iconColor, opacity, filterCss,
        pointerEvents: isPlaceholder ? 'none' : 'auto',
        noLogo: !t.logo,
        logoSize, initialsSize, initialsFontSize, labelSize, subtitleSize,
      };
    });

    return {
      tiles,
      files: files.map((f) => ({
        ...f,
        fontWeight: f.used ? 700 : 400,
        fontSize: f.used ? 15 : 13,
        textColor: f.used ? '#1d1f20' : 'rgba(29,31,32,0.4)',
        categoryLabel: f.category === 'pdf' ? 'PDF' : 'IMAGE',
        tagBg: f.category === 'pdf' ? '#eef6ff' : '#f2ede6',
        tagColor: f.category === 'pdf' ? '#2c455d' : '#6b5a3a',
        useBg: f.used ? '#5980a6' : 'transparent',
        useColor: f.used ? '#f2f2f3' : '#1d1f20',
        useBorder: f.used ? '#5980a6' : 'rgba(29,31,32,0.16)',
        toggleUse: () => this.toggleUse(f.id),
        remove: () => this.removeFile(f.id),
      })),
      noFiles: files.length === 0,
      fileInputRef: this.fileInputRef,
      onDropzoneClick: this.onDropzoneClick,
      onDragOver: this.onDragOver,
      onDragLeave: this.onDragLeave,
      onDrop: this.onDrop,
      onFileInput: this.onFileInput,
      dropBorderColor: dragOver ? '#5980a6' : 'rgba(29,31,32,0.16)',
      dropBg: dragOver ? '#eef6ff' : 'transparent',
      dropHeadline: detected === 'pdf' ? 'PDF tools highlighted below'
        : detected === 'image' ? 'Image tools highlighted below'
        : 'Drop files to find the right tool',
    };
  }
}
</script>
</body>
</html>
