<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&display=swap" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    a { color: #5980a6; }
    a:hover { color: #416180; }
  </style>
</helmet>
<div style="min-height:100vh; background:#fff; font-family:'Barlow',system-ui,sans-serif; color:#1d1f20; display:flex; justify-content:center; padding:{{ outerPadding }}; font-size:15px;">
  <div style="max-width:960px; width:100%;">
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; min-height:44px;">
        <a href="./PDF-IMG-MGR.dc.html" title="Back to Main Menu" style="flex-shrink:0; display:block;"><img src="./assets/PDF-IMG-MGR.png" style="width:44px; height:44px; object-fit:contain; display:block;" /></a>
        <h1 style="font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:600; font-size:22px; letter-spacing:-0.015em; margin:0; white-space:nowrap; text-align:right;">PDF-JPG</h1>
      </div>
    </sc-if>
    <sc-if value="{{ isDesktopHeader }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex; flex-wrap:wrap-reverse; align-items:center; justify-content:flex-start; column-gap:14px; row-gap:10px; margin-bottom:14px;">
        <div style="display:grid; grid-template-columns:repeat(4, 80px); row-gap:20px; column-gap:8px; justify-items:center; align-items:center;">
        <a href="./PDF-MARKUP.dc.html" title="PDF-MARKUP"><img src="./assets/PDF-MARKUP.png" style="width:50px; height:50px; object-fit:contain; display:block; transition:width 0.2s ease, height 0.2s ease;" style-hover="width:80px; height:80px;" /></a>
        <a href="./PDF-FLATTENER.dc.html" title="PDF-FLATTENER"><img src="./assets/PDF-FLATTENER.png" style="width:50px; height:50px; object-fit:contain; display:block; transition:width 0.2s ease, height 0.2s ease;" style-hover="width:80px; height:80px;" /></a>
        <a href="./PDF-CREATOR.dc.html" title="PDF-CREATOR"><img src="./assets/PDF-CREATOR.png" style="width:50px; height:50px; object-fit:contain; display:block; transition:width 0.2s ease, height 0.2s ease;" style-hover="width:80px; height:80px;" /></a>
        <a href="./PDF-SPLITTER.dc.html" title="PDF-SPLITTER"><img src="./assets/PDF-SPLITTER.png" style="width:50px; height:50px; object-fit:contain; display:block; transition:width 0.2s ease, height 0.2s ease;" style-hover="width:80px; height:80px;" /></a>
        <a href="./PDF-WATERMARK.dc.html" title="PDF-WATERMARK"><img src="./assets/PDF-WATERMARK.png" style="width:50px; height:50px; object-fit:contain; display:block; transition:width 0.2s ease, height 0.2s ease;" style-hover="width:80px; height:80px;" /></a>
        <img src="./assets/PDF-JPG.png" style="width:80px; height:80px; object-fit:contain; display:block; border-radius:12px; border:1.5px solid rgba(29,31,32,0.18); box-shadow:0 3px 6px rgba(29,31,32,0.18), 0 1px 3px rgba(29,31,32,0.12); background:#fff;" />
        <a href="./IMAGE-CONVERTOR.dc.html" title="MULTI-IMAGE-CONVERTER"><img src="./assets/IMAGE-CONVERTOR.png" style="width:50px; height:50px; object-fit:contain; display:block; transition:width 0.2s ease, height 0.2s ease;" style-hover="width:80px; height:80px;" /></a>
        <a href="./IMAGE-SPLITTER.dc.html" title="IMAGE-SPLITTER"><img src="./assets/IMAGE-SPLITTER.png" style="width:50px; height:50px; object-fit:contain; display:block; transition:width 0.2s ease, height 0.2s ease;" style-hover="width:80px; height:80px;" /></a>
        </div>
        <div style="display:flex; align-items:center; gap:14px; margin-left:auto;">
          <button onClick="{{ reset }}" title="Clear all dropped files and inputs" style="width:50px; height:50px; flex-shrink:0; border:none; background:none; padding:0; cursor:pointer; display:block;"><img src="./assets/CLEAR-REFRESH-PAGE.png" style="width:50px; height:50px; object-fit:contain; display:block; border-radius:12px; border:1.5px solid rgba(29,31,32,0.18); box-shadow:0 3px 6px rgba(29,31,32,0.18), 0 1px 3px rgba(29,31,32,0.12); background:#fff;" /></button>
          <a href="./PDF-IMG-MGR.dc.html" title="PDF-IMAGE-MANAGER" style="display:block;"><img src="./assets/PDF-IMG-MGR.png" style="width:100px; height:100px; object-fit:contain; display:block; border-radius:12px; border:1.5px solid rgba(29,31,32,0.18); box-shadow:0 3px 6px rgba(29,31,32,0.18), 0 1px 3px rgba(29,31,32,0.12); background:#fff;" /></a>
          <h1 style="font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:600; font-size:{{ titleFontSize }}px; letter-spacing:-0.015em; margin:0; white-space:nowrap;">PDF-JPG</h1>
          <a href="http://bluejetty.ca" target="_blank" rel="noopener" style="display:block;">
            <img src="./assets/bluejetty.png" style="width:{{ headerLogoSize }}px; height:{{ headerLogoSize }}px; object-fit:contain; display:block; transition:width 0.2s ease, height 0.2s ease, border-radius 0.2s ease, box-shadow 0.2s ease;" style-hover="width:100px; height:100px; border-radius:12px; border:1.5px solid rgba(29,31,32,0.18); box-shadow:0 3px 6px rgba(29,31,32,0.18), 0 1px 3px rgba(29,31,32,0.12); background:#fff;" />
          </a>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ noFile }}" hint-placeholder-val="{{ true }}">
      <dc-import name="DropBox" hint-size="100%,165px"
        headline="DROP-BOX"
        box-padding="16px 20px"
        box-margin-bottom="24px"
        file-types-label="PDF"
        accept-types="application/pdf"
        url-placeholder="Or paste a PDF URL…"
        drop-border-color="{{ dropBorderColor }}"
        drop-bg="{{ dropBg }}"
        on-drag-over="{{ onDragOver }}"
        on-drag-leave="{{ onDragLeave }}"
        on-drop="{{ onDrop }}"
        on-dropzone-click="{{ onDropzoneClick }}"
        file-input-ref="{{ fileInputRef }}"
        on-file-input="{{ onFileInput }}"
        url-input="{{ urlInput }}"
        on-url-input-change="{{ onUrlInputChange }}"
        load-from-url="{{ loadFromUrl }}"
        stop-propagation="{{ stopPropagation }}"
        on-paste-click="{{ onPasteClick }}"
      ></dc-import>

      <div style="position:relative; border:1px solid rgba(29,31,32,0.16); background:#fff; margin-top:16px; display:flex; flex-direction:column; min-height:180px;">
        <div style="font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:rgba(29,31,32,0.6); padding:14px 14px 0; margin-bottom:8px;">Preview window</div>
        <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:0 14px 14px;">
          <div style="font-size:13px; color:rgba(29,31,32,0.45); text-align:center;">JPG preview will display in this window</div>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:18px; padding:14px 18px; border:1px solid rgba(29,31,32,0.16); margin-top:16px; flex-wrap:wrap; opacity:0.5; pointer-events:none;">
        <div style="font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:rgba(29,31,32,0.6);">Resolution</div>
        <div style="display:inline-flex; overflow:hidden; border:1px solid rgba(29,31,32,0.16);">
          <label style="display:inline-flex; align-items:center; gap:6px; padding:7px 14px; font-size:13px; color:#1d1f20;">150 DPI (smaller file)</label>
          <label style="display:inline-flex; align-items:center; gap:6px; padding:7px 14px; font-size:13px; border-left:1px solid rgba(29,31,32,0.16); background:#5980a6; color:#f2f2f3;">300 DPI (print quality)</label>
          <label style="display:inline-flex; align-items:center; gap:6px; padding:7px 14px; font-size:13px; border-left:1px solid rgba(29,31,32,0.16); color:#1d1f20;">600 DPI (high resolution image)</label>
        </div>
        <button style="border:1px solid #5980a6; background:#5980a6; color:#f2f2f3; font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:600; font-size:14px; letter-spacing:0.02em; padding:9px 20px; margin-left:auto;">PDF-JPG / SAVE</button>
      </div>
    </sc-if>

    <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; align-items:center; gap:12px; padding:32px 0; color:rgba(29,31,32,0.6); font-size:14px;">
        <div style="width:18px; height:18px; border:2px solid rgba(29,31,32,0.2); border-top-color:#5980a6; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
        Loading PDF…
      </div>
    </sc-if>

    <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}">
      <div style="padding:14px 18px; border:1px solid #b23b3b; color:#8a2c2c; font-size:14px; margin-top:16px;">{{ error }}</div>
    </sc-if>

    <sc-if value="{{ hasPages }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; margin:8px 0 20px 0;">
        <div style="display:flex; align-items:center; gap:14px;">
          <div style="font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:600; font-size:18px;">{{ fileName }}</div>
          <div style="display:inline-flex; align-items:center; font-size:11px; letter-spacing:0.02em; padding:3px 10px; background:#eef6ff; color:#2c455d;">{{ pageCountLabel }}</div>
          <button onClick="{{ reset }}" style="border:none; background:none; color:#5980a6; font-size:13px; cursor:pointer; padding:4px 0; font-family:inherit;" style-hover="color:#416180;">Choose different file</button>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <button onClick="{{ selectAll }}" style="border:1px solid rgba(29,31,32,0.16); background:transparent; color:#1d1f20; padding:7px 12px; font-size:13px; cursor:pointer; font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:600;" style-hover="background:rgba(29,31,32,0.07);">Select all</button>
          <button onClick="{{ selectNone }}" style="border:1px solid rgba(29,31,32,0.16); background:transparent; color:#1d1f20; padding:7px 12px; font-size:13px; cursor:pointer; font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:600;" style-hover="background:rgba(29,31,32,0.07);">Select none</button>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:20px; margin-bottom:32px;">
        <sc-for list="{{ pages }}" as="page" hint-placeholder-count="4">
          <div
            onClick="{{ page.toggle }}"
            style="position:relative; border:1px solid {{ page.borderColor }}; cursor:pointer;"
          >
            <div style="position:absolute; top:-6px; left:-6px; width:11px; height:11px; color:{{ page.cornerColor }};" style-before="content:''; position:absolute; left:5px; top:0; width:1px; height:100%; background:currentColor;" style-after="content:''; position:absolute; top:5px; left:0; width:100%; height:1px; background:currentColor;"></div>
            <div style="position:absolute; top:-6px; right:-6px; width:11px; height:11px; color:{{ page.cornerColor }};" style-before="content:''; position:absolute; left:5px; top:0; width:1px; height:100%; background:currentColor;" style-after="content:''; position:absolute; top:5px; left:0; width:100%; height:1px; background:currentColor;"></div>
            <div style="position:absolute; bottom:-6px; left:-6px; width:11px; height:11px; color:{{ page.cornerColor }};" style-before="content:''; position:absolute; left:5px; top:0; width:1px; height:100%; background:currentColor;" style-after="content:''; position:absolute; top:5px; left:0; width:100%; height:1px; background:currentColor;"></div>
            <div style="position:absolute; bottom:-6px; right:-6px; width:11px; height:11px; color:{{ page.cornerColor }};" style-before="content:''; position:absolute; left:5px; top:0; width:1px; height:100%; background:currentColor;" style-after="content:''; position:absolute; top:5px; left:0; width:100%; height:1px; background:currentColor;"></div>
            <div style="position:relative; background:#e9e9ea;">
              <img src="{{ page.thumbDataUrl }}" style="display:block; width:100%; height:auto;" />
              <div style="position:absolute; top:8px; left:8px; width:20px; height:20px; background:{{ page.checkboxBg }}; border:1.5px solid {{ page.checkboxBorder }}; display:flex; align-items:center; justify-content:center;">
                <sc-if value="{{ page.checked }}" hint-placeholder-val="{{ true }}">
                  <div style="color:#f2f2f3; font-size:13px; font-weight:700; line-height:1;">✓</div>
                </sc-if>
              </div>
            </div>
            <div style="padding:8px 10px; font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:600; font-size:13px; letter-spacing:0.02em; color:rgba(29,31,32,0.75);">Page {{ page.displayIndex }}</div>
          </div>
        </sc-for>
      </div>

      <dc-import name="SaveBox" hint-size="100%,60px"
        label="Resolution"
        radio-name="jpgResolution"
        options="{{ resOptions }}"
        show-button="{{ true }}"
        button-label="{{ generateLabel }}"
        on-button-click="{{ generate }}"
        button-disabled="{{ generateDisabled }}"
        button-cursor="{{ generateCursor }}"
        button-opacity="{{ generateOpacity }}"
      ></dc-import>
      <sc-if value="{{ generating }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:14px; color:rgba(29,31,32,0.6); text-align:center; margin-top:10px;">{{ progressText }}</div>
      </sc-if>
      <sc-if value="{{ downloadUrl }}" hint-placeholder-val="{{ false }}">
        <div style="text-align:center; margin-top:10px;"><a href="{{ downloadUrl }}" download="{{ zipName }}" style="font-size:14px; color:#5980a6; font-weight:600; text-decoration:none;">Download {{ zipName }}</a></div>
      </sc-if>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    fileName: null,
    baseName: '',
    pages: [],
    loading: false,
    error: null,
    dpi: '300',
    generating: false,
    progressText: '',
    downloadUrl: null,
    zipName: '',
    dragOver: false,
    urlInput: '',
    isMobile: typeof window !== 'undefined' && window.innerWidth < 640,
  };

  fileInputRef = React.createRef();
  pdfDoc = null;

  componentDidMount() {
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    this.consumeHandoff();
    this._blockNav = (e) => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; };
    window.addEventListener('dragover', this._blockNav);
    window.addEventListener('drop', this._blockNav);
    this._onResize = () => {
      const isMobile = window.innerWidth < 640;
      if (isMobile !== this.state.isMobile) this.setState({ isMobile });
    };
    window.addEventListener('resize', this._onResize);
  }

  componentWillUnmount() {
    window.removeEventListener('dragover', this._blockNav);
    window.removeEventListener('drop', this._blockNav);
    window.removeEventListener('resize', this._onResize);
  }

  async consumeHandoff() {
    try {
      const raw = localStorage.getItem('pdfImageManagerHandoff');
      if (!raw) return;
      localStorage.removeItem('pdfImageManagerHandoff');
      const data = JSON.parse(raw);
      const match = (data.files || []).find((f) => f.type === 'application/pdf');
      if (!match) return;
      const blob = await (await fetch(match.dataUrl)).blob();
      this.loadPdf(new File([blob], match.name, { type: match.type }));
    } catch (err) { console.warn('Handoff load failed', err); }
  }

  onDropzoneClick = () => {
    if (this.fileInputRef.current) this.fileInputRef.current.click();
  };

  onDragOver = (e) => { e.preventDefault(); this.setState({ dragOver: true }); };
  onDragLeave = (e) => { e.preventDefault(); this.setState({ dragOver: false }); };

  onDrop = (e) => {
    e.preventDefault();
    this.setState({ dragOver: false });
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) this.loadPdf(file);
  };

  stopPropagation = (e) => e.stopPropagation();
  onUrlInputChange = (e) => this.setState({ urlInput: e.target.value });

  onPasteClick = async () => {
    try {
      if (navigator.clipboard && navigator.clipboard.read) {
        const items = await navigator.clipboard.read();
        for (const item of items) {
          for (const type of item.types) {
            if (type.startsWith('image/')) {
              const blob = await item.getType(type);
              const ext = type.split('/')[1] || 'png';
              this.loadPdf(new File([blob], `pasted_image.${ext}`, { type }));
              return;
            }
          }
        }
      }
      alert('Clipboard access denied or no image found. Try pressing Ctrl+V instead.');
    } catch (err) {
      alert('Could not read clipboard. Try pressing Ctrl+V instead.');
    }
  };

  async loadFromUrl() {
    const url = (this.state.urlInput || '').trim();
    if (!url) return;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      const name = (url.split('/').pop() || 'file.pdf').split('?')[0] || 'file.pdf';
      this.setState({ urlInput: '' });
      this.loadPdf(new File([blob], name, { type: blob.type || 'application/pdf' }));
    } catch (err) {
      alert('Could not load that URL (it may block cross-origin access): ' + err.message);
    }
  }

  onFileInput = (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) this.loadPdf(file);
  };

  reset = () => {
    this.pdfDoc = null;
    if (this.state.downloadUrl) URL.revokeObjectURL(this.state.downloadUrl);
    this.setState({
      fileName: null, baseName: '', pages: [], loading: false, error: null,
      generating: false, progressText: '', downloadUrl: null, zipName: '',
    });
  };

  async loadPdf(file) {
    if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
      this.setState({ error: 'Please drop a PDF file.' });
      return;
    }
    this.setState({ loading: true, error: null, downloadUrl: null, pages: [] });
    try {
      if (!window.pdfjsLib) throw new Error('PDF engine failed to load.');
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const buf = await file.arrayBuffer();
      const doc = await window.pdfjsLib.getDocument({ data: buf }).promise;
      this.pdfDoc = doc;
      const baseName = file.name.replace(/\.pdf$/i, '');
      const pages = [];
      for (let i = 1; i <= doc.numPages; i++) {
        const page = await doc.getPage(i);
        const nativeViewport = page.getViewport({ scale: 1 });
        const thumbScale = Math.min(1, 260 / nativeViewport.width);
        const viewport = page.getViewport({ scale: thumbScale });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport }).promise;
        pages.push({
          index: i,
          checked: true,
          thumbDataUrl: canvas.toDataURL('image/jpeg', 0.85),
        });
      }
      this.setState({ fileName: file.name, baseName, pages, loading: false });
    } catch (err) {
      this.setState({ loading: false, error: 'Could not read that PDF: ' + err.message });
    }
  }

  togglePage = (idx) => {
    this.setState((s) => ({
      pages: s.pages.map((p) => (p.index === idx ? { ...p, checked: !p.checked } : p)),
    }));
  };

  selectAll = () => this.setState((s) => ({ pages: s.pages.map((p) => ({ ...p, checked: true })) }));
  selectNone = () => this.setState((s) => ({ pages: s.pages.map((p) => ({ ...p, checked: false })) }));

  setDpi150 = () => this.setState({ dpi: '150' });
  setDpi300 = () => this.setState({ dpi: '300' });
  setDpi600 = () => this.setState({ dpi: '600' });

  async generate() {
    const { pages, baseName, dpi } = this.state;
    const checked = pages.filter((p) => p.checked);
    if (checked.length === 0 || !this.pdfDoc) return;
    if (this.state.downloadUrl) URL.revokeObjectURL(this.state.downloadUrl);
    this.setState({ generating: true, progressText: `0 / ${checked.length}`, downloadUrl: null });

    const zip = new window.JSZip();
    const scale = parseInt(dpi, 10) / 72;
    const padWidth = Math.max(2, String(pages.length).length);

    for (let i = 0; i < checked.length; i++) {
      const p = checked[i];
      const page = await this.pdfDoc.getPage(p.index);
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport }).promise;
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.92));
      const pageNum = String(p.index).padStart(padWidth, '0');
      zip.file(`${baseName}-${pageNum}.jpg`, blob);
      this.setState({ progressText: `${i + 1} / ${checked.length}` });
    }

    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(zipBlob);
    this.setState({ generating: false, progressText: '', downloadUrl: url, zipName: `${baseName}.zip` });
  }

  onMobileNav = (e) => { const v = e.target.value; if (v) window.location.href = v; };

  renderVals() {
    const { fileName, pages, loading, error, dpi, generating, progressText, downloadUrl, zipName, dragOver, isMobile } = this.state;
    const checkedCount = pages.filter((p) => p.checked).length;
    const accent = '#5980a6';
    const divider = 'rgba(29,31,32,0.16)';
    const disabled = checkedCount === 0 || generating;
    return {
      isMobile,
      isDesktopHeader: !isMobile,
      onMobileNav: this.onMobileNav,
      fileName, loading, error, generating, progressText, downloadUrl, zipName,
      noFile: !fileName,
      hasPages: pages.length > 0,
      pageCountLabel: `${pages.length} page${pages.length === 1 ? '' : 's'} · ${checkedCount} selected`,
      outerPadding: isMobile ? '28px 14px' : '56px 24px',
      headerGridCols: isMobile ? '1fr' : 'auto 1fr auto',
      navJustify: isMobile ? 'center' : 'flex-start',
      navFlexWrap: isMobile ? 'wrap' : 'nowrap',
      titleWhiteSpace: isMobile ? 'normal' : 'nowrap',
      titleAlign: isMobile ? 'center' : 'center',
      titleFontSize: isMobile ? 22 : 26,
      headerLogoSize: isMobile ? 56 : 80,
      dropBorderColor: dragOver ? accent : divider,
      dropBg: dragOver ? '#eef6ff' : '#f2f2f3',
      fileInputRef: this.fileInputRef,
      onDropzoneClick: this.onDropzoneClick,
      onDragOver: this.onDragOver,
      onDragLeave: this.onDragLeave,
      onDrop: this.onDrop,
      onFileInput: this.onFileInput,
      urlInput: this.state.urlInput,
      onUrlInputChange: this.onUrlInputChange,
      loadFromUrl: () => this.loadFromUrl(),
      stopPropagation: this.stopPropagation,
      onPasteClick: this.onPasteClick,
      reset: this.reset,
      selectAll: this.selectAll,
      selectNone: this.selectNone,
      isFullRes: dpi === '300',
      resOptions: [
        { label: '150 DPI (smaller file)', checked: dpi === '150', onSelect: this.setDpi150 },
        { label: '300 DPI (print quality)', checked: dpi === '300', onSelect: this.setDpi300 },
        { label: '600 DPI (high resolution image)', checked: dpi === '600', onSelect: this.setDpi600 },
      ].map((o) => ({ ...o, bg: o.checked ? accent : 'transparent', color: o.checked ? '#f2f2f3' : '#1d1f20' })),
      fullResBg: dpi === '300' ? accent : 'transparent',
      generateDisabled: disabled,
      generateCursor: disabled ? 'not-allowed' : 'pointer',
      generateOpacity: disabled ? 0.45 : 1,
      generateBg: accent,
      generateBorder: accent,
      generateLabel: generating ? 'SAVING…' : 'PDF-JPG / SAVE',
      generate: () => this.generate(),
      pages: pages.map((p) => ({
        ...p,
        displayIndex: p.index,
        toggle: () => this.togglePage(p.index),
        borderColor: p.checked ? accent : divider,
        cornerColor: p.checked ? accent : 'rgba(29,31,32,0.55)',
        checkboxBg: p.checked ? accent : 'transparent',
        checkboxBorder: p.checked ? accent : divider,
      })),
    };
  }
}
</script>
</body>
</html>
